<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ambient Dev Space</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fira Code', monospace;
    }

    body {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(56, 189, 248, 0.05);
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 999px;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 1.8rem;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .clock-box {
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.15);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .clock {
      font-size: 2.2rem;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: 2px;
    }

    .date {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 4px;
    }

    .sound-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .sound-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.25s ease;
    }

    .sound-card.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    .sound-info {
      text-align: left;
    }

    .sound-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .sound-desc {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .btn-toggle {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: 0.2s;
    }

    .sound-card.active .btn-toggle {
      background: #ef4444;
    }

    .quote-box {
      font-size: 0.8rem;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 15px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">● Focus Mode</div>
    <h1>Ambient Dev Space</h1>
    <p class="subtitle">Focus, Code & Stay Productive</p>

    <div class="clock-box">
      <div class="clock" id="clock">00:00:00</div>
      <div class="date" id="date">Loading...</div>
    </div>

    <div class="sound-grid">
      <div class="sound-card" id="card-rain">
        <div class="sound-info">
          <div class="sound-title">🌧️ Deep Rain</div>
          <div class="sound-desc">Ambient rain drops</div>
        </div>
        <button class="btn-toggle" onclick="toggleRain()">Play</button>
      </div>

      <div class="sound-card" id="card-typing">
        <div class="sound-info">
          <div class="sound-title">⌨️ Mechanical Keys</div>
          <div class="sound-desc">Soft key clicks</div>
        </div>
        <button class="btn-toggle" onclick="toggleTyping()">Play</button>
      </div>

      <div class="sound-card" id="card-whitenoise">
        <div class="sound-info">
          <div class="sound-title">📻 Brown Noise</div>
          <div class="sound-desc">Low frequency focus hum</div>
        </div>
        <button class="btn-toggle" onclick="toggleNoise()">Play</button>
      </div>
    </div>

    <div class="quote-box">
      "Small daily improvements over time lead to stunning results."
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString();
      document.getElementById('date').innerText = now.toLocaleDateString(undefined, {
        weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    let rainNode = null;
    function toggleRain() {
      const card = document.getElementById('card-rain');
      const btn = card.querySelector('button');
      const ctx = getAudioCtx();

      if (rainNode) {
        rainNode.stop();
        rainNode.disconnect();
        rainNode = null;
        card.classList.remove('active');
        btn.innerText = 'Play';
      } else {
        const bufferSize = ctx.sampleRate * 2;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          data[i] = (lastOut + 0.02 * white) / 1.02;
          lastOut = data[i];
          data[i] *= 3.5;
        }

        rainNode = ctx.createBufferSource();
        rainNode.buffer = buffer;
        rainNode.loop = true;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 800;

        const gain = ctx.createGain();
        gain.gain.value = 0.4;

        rainNode.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        rainNode.start();
        card.classList.add('active');
        btn.innerText = 'Stop';
      }
    }

    let typingTimer = null;
    function toggleTyping() {
      const card = document.getElementById('card-typing');
      const btn = card.querySelector('button');
      const ctx = getAudioCtx();

      if (typingTimer) {
        clearInterval(typingTimer);
        typingTimer = null;
        card.classList.remove('active');
        btn.innerText = 'Play';
      } else {
        function click() {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150 + Math.random() * 200, ctx.currentTime);

          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.04);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        }

        typingTimer = setInterval(() => {
          if (Math.random() > 0.3) click();
        }, 130);

        card.classList.add('active');
        btn.innerText = 'Stop';
      }
    }

    let noiseNode = null;
    function toggleNoise() {
      const card = document.getElementById('card-whitenoise');
      const btn = card.querySelector('button');
      const ctx = getAudioCtx();

      if (noiseNode) {
        noiseNode.stop();
        noiseNode.disconnect();
        noiseNode = null;
        card.classList.remove('active');
        btn.innerText = 'Play';
      } else {
        const bufferSize = ctx.sampleRate * 2;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * 0.08;
        }

        noiseNode = ctx.createBufferSource();
        noiseNode.buffer = buffer;
        noiseNode.loop = true;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 350;

        noiseNode.connect(filter);
        filter.connect(ctx.destination);

        noiseNode.start();
        card.classList.add('active');
        btn.innerText = 'Stop';
      }
    }
  </script>
</body>
</html>
